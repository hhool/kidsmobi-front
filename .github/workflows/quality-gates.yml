name: Quality Gates

# 每次代码提交/发布 + 每周定时的全维度检测体系。
#
# 维度总览（job 编号即执行顺序）：
#   ① diff-review     代码审核维度：对本次 diff 做风险分级 + 规则模式审核
#                     （诚实宣称 / UiStrings as const / canonical 绕过 / TDK 超限 /
#                       密钥字面量 / CMS 写脚本缺 token / infra 爆炸半径）
#   ② static-gates    快速门（无构建）：lazy default 导出（React #306 类）、
#                      tsc 类型检查、public SEO 资产（robots/sitemap/_redirects）
#   ③ build-gates     构建门：build + dist 守卫（内容下限 / 评论数上限 /
#                      SPA-prerender 标题·关键词·canonical 一致 / 诚实宣称 /
#                      内链 / prerender 标题）
#   ④ hydration       水合探针：本地起 dist 静态服务，真实浏览器逐路由查
#                      "Page Recovery Mode" / pageerror（curl 类守卫唯一看不见的失败类）
#   ⑤ weekly-audit    定时维度（仅 schedule/dispatch）：线上只读审计
#                      （站点健康分 / GEO 答案引擎就绪度 / 关键词机会扫描）
#   ⑥ hydration-live  定时维度：直接探测生产站的水合状态
#   ⑦ alert           定时维度：任一 job 失败 → 自动开/续 [ci-alert] issue
#
# 触发语义：
#   pull_request  = 合并前门（建议仓库设置 branch protection 要求这些 check 通过）
#   push main     = 发布后验证（Pages 在 push 时自动部署，门是事后哨兵；
#                   失败即"坏代码已上线"，走 fix-forward + ⑦ 告警）
#   schedule      = 每周一 09:00 (GMT+8) 全量重跑 + 线上审计
#   dispatch      = 手动全量
#
# 本 workflow 不使用任何 secret（纯代码/公开只读探测），fork PR 也能跑。
# 分钟数预算：push ≈ 4 job×~4min；schedule ≈ 10min/周。

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 1 * * 1" # Monday 01:00 UTC = 09:00 GMT+8
  workflow_dispatch:
    inputs:
      note:
        description: "手动触发说明（可选）"
        required: false
        default: "manual full gate run"

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ ① 代码审核
  diff-review:
    name: "① Diff review (code-review dimension)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve review range base
        run: |
          # PR → base 分支尖端；push → 推送前 HEAD；schedule/dispatch → 7 天前的提交
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "DIFF_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "DIFF_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE=$(git rev-list -1 --before='7 days ago' HEAD || true)" >> "$GITHUB_ENV"
          fi
          echo "head=${{ github.sha }}"

      - name: Run diff review
        run: node scripts/ci/diff-review.mjs

  # ------------------------------------------------------------------ ② 快速门
  static-gates:
    name: "② Static gates (no build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: lazy default exports (React #306 class)
        run: npm run check:lazyexports

      - name: prerender vs hydrated rich-content parity (## / lists / labels)
        run: npm run check:richparity

      - name: typecheck
        run: npx tsc --noEmit

      - name: public SEO assets (robots / sitemap / _redirects)
        run: npm run seo:check

      - name: diff-review rule self-test
        # The honesty rule set has no build dependency, so its self-test runs
        # here. Without it a rule can decay silently: the bare-实测 catch-all
        # once blocked legitimate developer prose for a week.
        run: node scripts/ci/diff-review.mjs --self-test

  # ------------------------------------------------------------------ ③ 构建门
  build-gates:
    name: "③ Build + dist guards"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build (stale-tolerant prerender, offline-safe via cms-snapshots)
        run: npm run build
        env:
          PRERENDER_ALLOW_STALE: "1"

      - name: Content floor (no empty-body pages)
        run: npm run check:content

      - name: Review-count ceiling
        run: npm run check:reviewcounts

      - name: SPA vs prerender titles
        run: npm run check:spatitles

      - name: SPA vs prerender keywords
        run: npm run check:spakeywords

      - name: SPA vs prerender canonicals
        run: npm run check:spacanonicals

      - name: Honesty claims (dist + src)
        run: npm run check:claims

      - name: Internal links
        run: npm run check:links

      - name: Prerender titles
        run: npm run check:titles

      # Five of nine news stories shipped with no cover at all: text-only cards
      # on /news and an article page with nothing above the fold.
      - name: News cover images
        run: npm run check:newscovers

      # 45 of the 56 guide covers were centre-cropped inside the file, so the
      # subject (wheels, handlebars) was gone before the page ever rendered
      # it. Nothing in the DOM could show that, because the page uses
      # object-contain, which letterboxes a cropped file just as happily.
      - name: Article cover geometry (no crop)
        run: npm run check:covergeometry

      # The body cover is capped at 384px in a 768px column, so centred and
      # left-aligned look equally plausible in a diff - and the static HTML
      # and the SPA have to agree, or one of the two audiences gets a cover
      # pinned to the left margin.
      - name: Article hero alignment
        run: npm run check:heroalign

      # The Chinese hubs declared their alternates while the English hubs did
      # not, and the homepage once declared hreflang for currency views that
      # canonicalize back to itself. An hreflang annotation that runs one way,
      # that only exists in the SPA, or that points at a non-canonical target
      # is one no crawler acts on.
      - name: hreflang reciprocity
        run: npm run check:hreflang

      # The five section hubs shipped no BreadcrumbList at all, so the one
      # place a "Home > section" trail is most obvious was missing it. An
      # audit also read the pages as bare because their JSON-LD is an array —
      # this guard unwraps arrays and pairs Article with its breadcrumb.
      - name: JSON-LD breadcrumbs
        run: npm run check:jsonld

      # A /zh page is a Chinese page. The prerendered footer, the related-
      # reviews titles, the hub card meta, the cluster nav and the byline all
      # leaked English onto the Chinese editions at some point, and none of
      # it looked like a bug in review - it looked like content.
      - name: Chinese pages carry no English UI
        run: npm run check:zh-english

      # The zh guide-text sanitizer localizes terms and strips long English
      # fragments over raw markdown. Both passes used to chew through URLs:
      # "/guides/budget/balance-bike-price-tiers" was eaten as marketing
      # English (leaking literal "[text](/" into every hydrated zh guide
      # body) and "stroller"/"maintenance"/"scooter" inside paths was
      # rewritten into Chinese (404ing the link). The prerender never ran
      # the sanitizer, so only the hydrated pages were broken.
      - name: Guide sanitizer keeps markdown intact
        run: npm run check:guidetext

      # The analytics and affiliate pipes are configuration-driven, so they
      # are usually switched OFF and their code never runs. These are the
      # invariants that have to hold the day the owner turns them on.
      - name: Tracking and affiliate links
        run: npm run check:tracking

      # The Tailwind bundle no longer blocks the first paint (it is preloaded and
      # swapped in when it arrives), so the prerendered pages paint on the CSS
      # inlined in their <head>. That inlined block repeats values from
      # src/index.css, and it must not drift: a drifted font stack is invisible
      # in review and obvious on the page. This also asserts that no prerendered
      # page ships a blocking <link rel="stylesheet"> - the render blocker the
      # teardown audit (item 26) and Lighthouse's render-blocking audit both
      # count. See scripts/seo/render-blocking-probe.mjs for the browser-side
      # half of the same question.
      - name: Critical CSS inlined, no blocking stylesheet
        run: npm run check:criticalcss

      # The homepage is assembled by scripts/build-static-home.mjs, which
      # refuses a document that carries the things which broke it before: an
      # inline stylesheet that blocks paint, a skipped subtree
      # (content-visibility) that both costs main-thread time and makes the
      # sections report a placeholder as their height, a dropped TDK.
      #
      # The assembler runs those rules on every build, so a document that
      # breaks one never reaches dist. What nothing checked is whether the
      # rules still WORK: delete or invert one and the build stays green
      # because nothing contradicts it. This step runs the assembler's own
      # reverse assertions - each re-introduces a defect and fails unless the
      # rule catches it - so the rule set cannot lose its teeth between builds.
      - name: Static-home rules can still fail
        run: npm run check:statichome

      # The prerendered article is painted first and the SPA takes over from
      # under it, so the reader never sees the page being rebuilt. That cover
      # is an inline script with four ways to fail: it can reveal an empty
      # #root (white screen), reveal a Suspense skeleton (a page that never
      # finishes), put the cover back into the document flow (the 0.290401
      # layout shift all over again), or wait on a character count that the
      # shortest published page can never reach. The guard executes the
      # shipped script against a small DOM and asserts what the reader would
      # have seen, because none of that is visible in the source.
      - name: Static first screen holds until the SPA has its content
        run: npm run check:firstpaint

      # The homepage hero is the LCP, and it is a CSS background-image - a
      # thing the HTML parser cannot see. Without a preload the browser only
      # learned about the 141 KB file after the SPA had mounted: measured on
      # the live site the request did not start until 2,083 ms. The prerender
      # now preloads it from the document head (27 ms) and preconnects to the
      # origin. The guard reads the built page, so a dropped tag fails the
      # build, and it compares the preloaded URL against the one the SPA
      # paints - a preload of the wrong image is worse than no preload at all.
      - name: Homepage hero image is discoverable in the document
        run: npm run check:heropreload

      # Discoverable is not enough - it also has to be small. On Lighthouse's
      # mobile preset (562.5 ms of request latency, 1.6 Mbps) the hero's bytes
      # go straight into the Largest Contentful Paint: the same photograph at
      # 960 px / 102 KB measured 2,330 ms and at 768 px / 35 KB measured
      # 1,797 ms, against a 2,000 ms budget.
      #
      # The trap this closes is that the wrong file looks right. The hero is
      # painted at 62 % opacity under a dark gradient, so a well-meaning 2x
      # re-export is indistinguishable on screen and costs 600 ms of paint.
      # The guard pins the width, the aspect the layout was measured at, the
      # byte ceiling, and that each file is really a WebP rather than a PNG
      # with the extension renamed.
      - name: Homepage hero stays inside its paint budget
        run: npm run check:heroweight

      # The webfonts were served from Google: 465,802 bytes across seven
      # requests, and they moved the LCP by 3,284 ms - not because of the byte
      # count, but because a second origin is a second connection and bytes
      # that cannot share the one the page is already using. Serving the same
      # bytes from this origin recovered 3,619 ms of it.
      #
      # The mirror is committed under public/fonts/, so this gate needs no
      # network and the build never depends on Google being reachable. The
      # guard checks three things: the mirror still matches its manifest, no
      # page references a third-party font any more, and every character a
      # page uses is covered by a rule whose file was actually mirrored - a
      # missing file makes the browser fall back to the system font silently,
      # and the site then looks exactly as it did before.
      - name: Webfonts served from this origin
        run: npm run check:fonts

      # Google Search showed its default grey globe for every result: the only
      # declared favicon was an SVG (absent from the formats Google lists for
      # search favicons) and /favicon.ico was a 404. This pins the raster set,
      # Google's 48-multiple sizing rule, and the head declarations in BOTH
      # HTML sources (index.html plus the prerender template) - editing only
      # index.html changes nothing, because the live pages come from prerender.
      - name: Favicon set for search results
        run: npm run check:favicons

      # Pages silently drops every line past ~120, and the SPA fallback is last.
      - name: Redirect budget (dist/_redirects)
        run: npm run check:redirects

      # Eight URL pairs carry the same topic twice. Whole-page similarity never
      # catches them drifting back together — the shared cluster nav dilutes it —
      # so this discounts site chrome by document frequency first.
      - name: Same-topic pair drift
        run: npm run check:pairdrift

      - name: Upload dist for the hydration probe
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  # ------------------------------------------------------------------ ④ 水合探针（本地 dist）
  hydration:
    name: "④ Hydration probe (browser, local dist)"
    runs-on: ubuntu-latest
    needs: build-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve dist and probe every curated route, then the consent gate
        run: |
          set -euo pipefail
          npx vite preview --outDir dist --port 4173 --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null # hard fail if the server never came up
          SEO_SITE_BASE_URL=http://127.0.0.1:4173 node scripts/seo/hydration-probe.mjs
          # R-910: the tracking must not start before the reader has agreed to
          # analytics. Only a browser can see when the script is actually
          # requested, so the consent gate is probed next to the hydration.
          SEO_SITE_BASE_URL=http://127.0.0.1:4173 node scripts/seo/consent-probe.mjs

  # ------------------------------------------------------------------ ⑤ 每周线上审计
  weekly-audit:
    name: "⑤ Weekly live audit (read-only)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Site health check (robots/sitemap/meta/llms/links)
        run: |
          set -o pipefail
          npm run seo:health 2>&1 | tee tmp-site-health.txt

      - name: GEO readiness (answer-engine crawlers, llms.txt, fact-ready pages)
        run: |
          set -o pipefail
          npm run seo:geo 2>&1 | tee tmp-geo.txt

      - name: Keyword opportunity scan (informational, always exits 0)
        run: npm run seo:keywords 2>&1 | tee tmp-keywords.txt

      - name: Publish reports to the run summary
        run: |
          {
            echo "### Site health"
            echo '```'
            cat tmp-site-health.txt
            echo '```'
            echo "### GEO readiness"
            echo '```'
            cat tmp-geo.txt
            echo '```'
            echo "### Keyword opportunities"
            echo '```'
            tail -40 tmp-keywords.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-${{ github.run_number }}
          path: |
            tmp-site-health.txt
            tmp-geo.txt
            tmp-keywords.txt
          retention-days: 30

  # ------------------------------------------------------------------ ⑥ 生产水合探针
  hydration-live:
    name: "⑥ Hydration probe (browser, LIVE production)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Wait for the expected build to be live
        # Cloudflare Pages deploys asynchronously. Probing production while the
        # previous bundle is still being served would measure the old code, so
        # wait until the live site actually carries the build we expect.
        run: node scripts/seo/wait-for-deploy.mjs

      - name: Probe the live site (SEO_SITE_BASE_URL defaults to production)
        run: |
          node scripts/seo/hydration-probe.mjs
          # R-910 on production: the live pages must hand Google a full denial
          # before the reader has agreed to anything (Consent Mode v2).
          node scripts/seo/consent-probe.mjs

  # ------------------------------------------------------------------ ⑦ 定时失败告警
  alert:
    name: "⑦ Alert on scheduled failure"
    needs: [diff-review, static-gates, build-gates, hydration, weekly-audit, hydration-live]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open / update the [ci-alert] issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              `Scheduled quality-gate run on **${date}** had failing jobs.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Usual suspects, in order:`,
              `1. a guard regression on main (claims / canonicals / hydration / TDK),`,
              `2. a production outage during the live audit (health score drop, hydration-live),`,
              `3. an upstream data change (CMS) that a dist guard caught.`,
              ``,
              `_Auto-managed by \`.github/workflows/quality-gates.yml\` — a single open [ci-alert] issue is reused; later failures append comments._`,
            ].join('\n');

            // Best-effort label setup; the issue works with or without it.
            let labeled = true;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'ci-alert' });
            } catch {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: 'ci-alert', color: 'd73a4a', description: 'Automated quality-gate failure alerts' });
              } catch (e) {
                labeled = false;
                core.info(`label setup skipped: ${e.message}`);
              }
            }

            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title.startsWith('[ci-alert]'));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Still failing (${date}): ${runUrl}` });
              core.info(`commented on existing issue #${existing.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner, repo,
                title: `[ci-alert] Weekly quality gates failed — ${date}`,
                body,
                ...(labeled ? { labels: ['ci-alert'] } : {}),
              });
              core.info(`created issue #${issue.data.number}`);
            }
