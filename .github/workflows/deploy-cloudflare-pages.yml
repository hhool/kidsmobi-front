name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - refactor/site-origin
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy-pages:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type Check
        run: npm run lint

      - name: 🔨 Build
        run: npm run build
        env:
          # Production moved to kidstravellab.com on 2026-11-27. A GH build
          # that falls back to the launch domain would publish a canonical that
          # contradicts the live site, so the fallback follows the migration.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://kidstravellab.com' }}
          SITE_BRAND: ${{ vars.SITE_BRAND || 'KidsTravelLab' }}

      - name: 🚀 Deploy to Cloudflare Pages
        # The action calls /memberships at startup; the project API token has
        # Pages:Edit but not User->Details:Read, so that call 10000s and leaves
        # a permanently red workflow (Cloudflare's own git build already
        # deploys main). Call wrangler directly with the account id instead.
        run: npx --yes wrangler@4.168.0 pages deploy dist --project-name=kidsmobi --branch=${{ github.ref_name }} --account-id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: 📝 Deployment Summary
        run: |
          echo "## ✅ Cloudflare Pages Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: kidsmobi" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'preview' }}" >> $GITHUB_STEP_SUMMARY
