name: Purge Cloudflare Edge Cache

# 背景：balancebiketoddler.com 自定义域上有一条 Cache Rule，把预渲染 HTML 缓存 1 天
# (Edge TTL = ignore_origin / 86400)。Cloudflare Pages 发布新版本时**不会**自动清掉
# 这条 zone 缓存，不清的话边缘会继续返回旧 HTML 最长 24 小时。
# 所以每次 push 到 main 触发 Pages 部署后，需要主动 purge 一次。
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "等待 Pages 部署完成的秒数"
        required: false
        default: "300"

jobs:
  purge:
    name: Purge zone cache after Pages deploy
    runs-on: ubuntu-latest
    # 没配 secrets 时直接跳过，不打断既有 CI
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}

    steps:
      - name: ⏳ Wait for Cloudflare Pages to finish deploying
        run: |
          SECONDS_TO_WAIT="${{ github.event.inputs.wait_seconds || '300' }}"
          echo "等待 ${SECONDS_TO_WAIT}s（实测 Pages 从 push 到生效约 190s）"
          sleep "$SECONDS_TO_WAIT"

      - name: 🧹 Purge everything
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "purge 失败"; exit 1; }

      - name: ✅ Verify HTML is re-cached
        run: |
          sleep 5
          echo "第一次（应为 MISS，重新回源取新版本）:"
          curl -sSI https://balancebiketoddler.com/ | grep -iE 'cf-cache-status|age' || true
          sleep 5
          echo "第二次（应为 HIT）:"
          curl -sSI https://balancebiketoddler.com/ | grep -iE 'cf-cache-status|age' || true

# 需要的 secrets（Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_ZONE_ID   = b6c304eb872e0df0b47e9c0d6730a5e7
#   CLOUDFLARE_API_TOKEN = 具备 Zone | Cache Purge | Edit 权限（只作用于本 zone）
#
# 注意：purge 必须发生在 Pages 部署**之后**。提前 purge 会让边缘重新缓存旧版本，
# 那就等于白做（甚至更糟）。延迟 300s 是按实测 187s 的部署耗时留的余量。
