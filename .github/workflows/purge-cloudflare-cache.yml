name: Purge Cloudflare Edge Cache

# 背景：balancebiketoddler.com 自定义域上有一条 Cache Rule，把预渲染 HTML 缓存 1 天
# (Edge TTL = ignore_origin / 86400)。Cloudflare Pages 发布新版本时**不会**自动清掉
# 这条 zone 缓存，不清的话边缘会继续返回旧 HTML 最长 24 小时。
# 所以每次 push 到 main 触发 Pages 部署后，需要主动 purge 一次。
#
# 注意：`secrets` 上下文不能出现在 `if:` 条件里（会被 GitHub 判定为非法 workflow 直接
# 整体失败、连 job 都不会创建）。因此改在 step 内用 shell 检查 secrets 是否存在，
# 不存在则打印提示并跳过；存在才执行真正的 purge。
#
# 触发方式（2026-10-24 增补 schedule）：
#   push           —— 前端发版后等 Pages 部署完成再 purge（原有路径）。
#   schedule       —— 每 2 小时一次。CMS 内容发布（新指南、改产品、配图）只写 D1、
#                    不产生 push，edge 上的旧副本没有触发源会一直活到 TTL 到期
#                    （HTML 规则 24h / API 规则 4h）。定时 purge 把这部分 staleness
#                    也兜住，CMS 改完最迟 2 小时全网可见。
#   workflow_dispatch —— 手动立即 purge；wait_seconds=0 可跳过等待。
on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每 2 小时（UTC）。GitHub cron 只支持 5 分钟粒度，高峰期可能延迟几分钟。
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "等待 Pages 部署完成的秒数"
        required: false
        default: "300"

jobs:
  purge:
    name: Purge zone cache after Pages deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check Cloudflare secrets
        id: guard
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN 未配置，跳过 purge（CDN 缓存不会自动清理，需手动 Purge Everything）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ⏳ Wait for Cloudflare Pages to finish deploying
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push'
        env:
          WAIT: ${{ github.event.inputs.wait_seconds }}
        run: |
          SECONDS_TO_WAIT="${WAIT:-300}"
          echo "等待 ${SECONDS_TO_WAIT}s（实测 Pages 从 push 到生效约 190s）"
          sleep "$SECONDS_TO_WAIT"

      - name: 🧹 Purge everything
        if: steps.guard.outputs.skip != 'true'
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          resp=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "purge 失败"; exit 1; }

      - name: ✅ Verify HTML is re-cached
        if: steps.guard.outputs.skip != 'true'
        run: |
          sleep 5
          echo "第一次（应为 MISS，重新回源取新版本）:"
          curl -sSI https://balancebiketoddler.com/ | grep -iE 'cf-cache-status|age' || true
          sleep 5
          echo "第二次（应为 HIT）:"
          curl -sSI https://balancebiketoddler.com/ | grep -iE 'cf-cache-status|age' || true

      - name: ✅ Verify sitemap freshness (clean path)
        if: steps.guard.outputs.skip != 'true'
        run: |
          sleep 8
          echo "检查 /sitemap.xml（Google 实际抓的干净路径，无 query）:"
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://balancebiketoddler.com/sitemap.xml)
          ct=$(curl -sSI https://balancebiketoddler.com/sitemap.xml | grep -i '^content-type' | tr -d '\r')
          body=$(curl -sS https://balancebiketoddler.com/sitemap.xml)
          urls=$(printf '%s' "$body" | grep -o '<loc>[^<]*</loc>' | wc -l)
          prio=$(printf '%s' "$body" | grep -c '<priority>')
          bdg=$(printf '%s' "$body" | grep -c 'balance-bike-budget')
          echo "  HTTP: $code | $ct"
          echo "  URL 数: $urls | 含 <priority>: $prio | 含 balance-bike-budget: $bdg"
          if [ "$code" = "200" ] && printf '%s' "$ct" | grep -qi 'application/xml'; then
            echo "✅ sitemap 路由正常（200 + application/xml），Google 可正常抓取"
          else
            echo "::warning::sitemap 路由异常：应为 200 + application/xml，实际 '$code' / '$ct'（检查 Cloudflare Worker 是否拦截 /sitemap.xml 干净路径）"
          fi

# 需要的 secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_ZONE_ID   = b6c304eb872e0df0b47e9c0d6730a5e7
#   CLOUDFLARE_API_TOKEN = 具备 Zone | Cache Purge | Edit 权限（只作用于本 zone）
#
# 注意：push 触发时，purge 必须发生在 Pages 部署**之后**。提前 purge 会让边缘重新
# 缓存旧版本，那就等于白做（甚至更糟）。延迟 300s 是按实测 187s 的部署耗时留的余量，
# 且等待步骤只对 push 生效；schedule 触发时没有部署要等，直接 purge。
# 若未配置 secrets，本 workflow 会成功结束但跳过 purge —— 此时需到 Cloudflare 面板手动 Purge Everything。
# 手动立即清理：Actions → Purge Cloudflare Edge Cache → Run workflow，wait_seconds 填 0。
